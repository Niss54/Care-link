[build]
command = "npm run build:client"
publish = "dist/client"
functions = "netlify/functions"
[build.environment]
NODE_VERSION = "18"
NPM_VERSION = "9"
[[redirects]]
from = "/api/triage"
to = "/.netlify/functions/triage"
status = 200
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[functions]
node_bundler = "esbuild"
